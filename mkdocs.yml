site_name: Docs Build Tool
site_description: Build static HTML and PDF documentation from structured Markdown directories.
docs_dir: docs
site_dir: site
exclude_docs: |
  /summary.md

copyright: Copyright &copy; 2026 <a href="https://github.com/Lio2rz" target="_blank">Lio2rz</a>. All rights reserved.

theme:
  name: material
  language: zh
  custom_dir: docs/overrides

plugins:
  - search
  - literate-nav:
      nav_file: summary.md
  - section-index

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
