[project]
name = "docsbuildtool"
version = "0.1.0"
description = "Build static HTML and PDF documentation from structured Markdown directories."
authors = [
    {name = "Lio2rz",email = "chen.mo@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.13"
keywords = ["documentation", "markdown", "mkdocs", "pdf", "static-site"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: MkDocs",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
]
dependencies = [
    "rich>=15.0.0",
    "typer>=0.15,<1.0",
]

[dependency-groups]
dev-group = [
    {include-group = "doc-group"},
    {include-group = "test-group"},
    "ruff>=0.9,<1.0",
]
doc-group = [
    "markdown>=3.7,<4.0",
    "mkdocs>=1.6.1,<2.0.0",
    "mkdocs-material>=9.6,<10.0",
    "mkdocs-with-pdf>=0.9.3,<1.0",
    "pymdown-extensions>=10.12,<11.0",
    "pyyaml>=6.0.2,<7.0",
]
test-group = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=6.0,<8.0",
]

[tool.poetry]
packages = [{include = "docsbuildtool", from = "src"}]

[tool.pytest.ini_options]
minversion = "8.3"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["docsbuildtool"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
