[project]
name = "docsbuildtool"
version = "0.1.0"
description = "Build static HTML and PDF documentation from structured Markdown directories."
authors = [
    {name = "Lio2rz",email = "chen.mo@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.13"
keywords = ["documentation", "markdown", "mkdocs", "pdf", "static-site"]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: MkDocs",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
]
dependencies = [
    "rich>=15.0.0,<16.0",
    "typer>=0.15,<1.0",
]

[dependency-groups]
dev-group = [
    {include-group = "doc-group"},
    {include-group = "test-group"},
    "black>=26.0,<27.0",
    "isort>=8.0,<9.0",
    "mypy>=2.1.0,<3.0",
    "ruff>=0.9,<1.0",
]
doc-group = [
    "markdown>=3.7,<4.0",
    "mkdocs>=1.6.1,<2.0.0",
    "mkdocs-literate-nav>=0.6.3,<1.0",
    "mkdocs-material>=9.6,<10.0",
    "mkdocs-section-index>=0.3.10,<1.0",
    "mkdocs-with-pdf>=0.9.3,<1.0",
    "pymdown-extensions>=10.12,<11.0",
    "pyyaml>=6.0.2,<7.0",
]
test-group = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=6.0,<8.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.scripts]
docs = "docsbuildtool.cli:app"

[tool.pytest.ini_options]
minversion = "8.3"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["docsbuildtool"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 120
src_paths = ["src", "tests"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
pretty = true
show_error_codes = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
]
